name: Validate and release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication; do not cancel a workflow while it is publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - run: python3 scripts/release.py validate
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --features okf-cli/url-sources
      - run: cargo xtask skills
      - name: Plan release
        id: release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py prepare

  build:
    needs: validate
    if: github.event_name == 'pull_request' || needs.validate.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up native musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C linker=musl-gcc -C target-feature=+crt-static' >> "$GITHUB_ENV"
      - run: rustup target add "$TARGET"
      - run: cargo test --locked -p okf-cli --features url-sources --target "$TARGET"
      - run: cargo build --locked --release -p okf-cli --features url-sources --target "$TARGET"
      - name: Smoke test and archive
        shell: bash
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/okf"
          "$binary" version
          "$binary" schema --json > schema.ndjson
          bundle="$RUNNER_TEMP/smoke-bundle"
          "$binary" init "$bundle"
          "$binary" validate "$bundle"
          if [ "$RUNNER_OS" = Linux ]; then
            if readelf -l "$binary" | grep -q INTERP; then
              echo 'Unexpected dynamic interpreter in Linux executable' >&2
              exit 1
            fi
          fi
          version=$("$binary" version | awk '{print $2}')
          mkdir -p package dist
          cp "$binary" package/okf
          cp LICENSE README.md package/
          tar -czf "dist/okf-$version-$TARGET.tar.gz" -C package okf LICENSE README.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: okf-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, build]
    if: needs.validate.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: okf-*
          merge-multiple: true
          path: dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
