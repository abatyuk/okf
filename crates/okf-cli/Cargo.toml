[package]
name = "okf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `okf` binary — arg parsing, output rendering, exit-code mapping."

[[bin]]
name = "okf"
path = "src/main.rs"

[dependencies]
okf-core = { path = "../okf-core" }
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
indexmap = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[features]
default = []
url-sources = ["okf-core/url-sources"]
